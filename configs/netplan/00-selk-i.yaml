network:
  version: 2
  ethernets:
    eth0:
      match:
        name: "enP4*"
      set-name: eth0
      addresses: [192.168.137.20/24]
      routes:
        - to: default
          via: 192.168.137.1
      nameservers:
        addresses: [1.1.1.1, 1.0.0.1]
    eth1:
      match:
        name: "enP3*"
      set-name: eth1
      addresses: [192.168.137.21/24]
